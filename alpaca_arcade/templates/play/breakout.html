{% extends "base.html" %}
{% block head %}
<script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>
<link rel="stylesheet" href="{{ url_for('static', filename='game.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='gameover.css') }}">
{% endblock %}
{%block title %}Breakout{% endblock %}

{% block main %}
<script src="{{ url_for("static", filename="gameover.js") }}" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="{{ url_for('static', filename='breakout.js') }}" type="module"></script>
<dialog id="end-game-modal" class="neon-border"></dialog>
<div class="game-container">
    <a href="/">
        <img src="/static/images/logo_mini.svg" alt="Alpaca Arcade logo mini" width=80 height=80>
    </a>
    <a class="game-button back-button" href="{{ url_for("overview.index", game="breakout") }}">Back to Leaderboard</a>
    <div class="game-container__breakout">
        <div class="game-container__breakout-metrics">
            <p class="game-metric game-metric__points">Points: <span class="game-metric__value"></span></p>
            <p class="game-metric game-metric__lives">Lives: <span class="game-metric__value"></span></p>
        </div>
        <div class="game-container__phaser-breakout"></div>
    </div>
</div>
{% endblock %}
